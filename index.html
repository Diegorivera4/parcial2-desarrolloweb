<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney+</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Encabezado -->
  <header>
    <img src="css/images/logo.png" alt="Logo de Disney Plus" class="logo">
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Películas</a></li>
        <li><a href="#">Series</a></li>
        <li><a href="#">Parques</a></li>
        <li><a href="#">Tienda</a></li>
      </ul>
    </nav>
  </header>

  <!-- Banner principal -->
  <section class="banner">
    <div class="contenido-banner">
      <h1>Bienvenido a Disney+</h1>
      <p>Explora lo mejor del entretenimiento familiar</p>
      <button>Comenzar ahora</button>
    </div>
  </section>

  <!-- Sección de películas -->
  <section class="peliculas">
    <h2>Películas Destacadas</h2>
    <div class="galeria">
      <img src="css/images/movies-1.jpeg" alt="Película 1">
      <img src="css/images/movies-2.jpeg" alt="Película 2">
      <img src="css/images/movies-3.jpeg" alt="Película 3">
      <img src="css/images/movies-4.jpeg" alt="Película 4">
    </div>
  </section>

  <!-- Sección de Parques -->
  <section class="parques">
    <h2>Magia en los Parques</h2>
    <div class="galeria">
      <img src="css/images/disney-parks-1.png" alt="Disney Park 1">
      <img src="css/images/disney-parks-2.png" alt="Disney Park 2">
    </div>
  </section>

  <!-- Sección Tienda -->
  <section class="tienda">
    <h2>Compra tus artículos favoritos</h2>
    <div class="galeria">
      <img src="css/images/shop-image-1.png" alt="Tienda 1">
      <img src="css/images/shop-image-2.png" alt="Tienda 2">
      <img src="css/images/shop-image-3.png" alt="Tienda 3">
    </div>
  </section>

  <!-- Pie de página -->
  <footer>
    <p>© 2025 Disney. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
